<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">Mini JEE Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-4 mb-4">
    <a class="navbar-brand fw-bold" th:href="@{/articles}">Mini Projet JEE</a>

    <div class="d-flex align-items-center gap-3">

        <!-- Articles : visible pour tous -->
		<a th:href="@{/articles}" class="text-white text-decoration-none">
		    <i class="bi bi-box-seam me-1"></i>Articles
		</a>
		
		<!-- Commandes : visible pour tous -->
		<a th:href="@{/commandes}" class="text-white text-decoration-none">
		    <i class="bi bi-receipt me-1"></i>Commandes
		</a>
		
		<!-- Panier : visible seulement pour ROLE_USER -->
		<a th:href="@{/panier}" class="text-white text-decoration-none"
		   sec:authorize="hasRole('USER')">
		    <i class="bi bi-cart me-1"></i>Panier
		</a>

        <!-- Séparateur -->
        <span class="text-white opacity-50">|</span>

        <!-- Badge admin uniquement si ROLE_ADMIN -->
        <span class="badge bg-warning text-dark" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-shield-check me-1"></i>Admin
        </span>

        <!-- Username connecté -->
        <span class="text-white">
            <i class="bi bi-person me-1"></i>
            <sec:authentication property="name"/>
        </span>

        <!-- Déconnexion -->
        <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
            </button>
        </form>
    </div>
</nav>

<!-- Messages flash succès / erreur -->
<div class="container">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- Contenu de la page -->
<div class="container">
    <div th:replace="${content}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
