<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">Mini JEE Shop</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar commune -->
<nav class="navbar navbar-dark bg-primary px-3 mb-4">
    <span class="navbar-brand fw-bold">Mini Projet JEE</span>

    <div class="d-flex align-items-center gap-3">
        <!-- Liens de navigation -->
        <a th:href="@{/articles}" class="text-white text-decoration-none">Articles</a>
        <a th:href="@{/commandes}" class="text-white text-decoration-none">Commandes</a>
        <a th:href="@{/panier}" class="text-white text-decoration-none">
            <i class="bi bi-cart"></i> Panier
        </a>

        <!-- Badge Administrateur -->
        <span class="text-white fw-bold" sec:authorize="hasRole('ADMIN')">Administrateur</span>

        <!-- Username connecté -->
        <span class="text-white">
            <sec:authentication property="name"/>
        </span>

        <!-- Déconnexion -->
        <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline-light btn-sm">Déconnexion</button>
        </form>
    </div>
</nav>

<!-- Contenu de chaque page -->
<div class="container">
    <div th:replace="${content}"></div>
</div>

</body>
</html>
