<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Commande — Mini JEE Shop</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">
            <i class="bi bi-receipt me-2 text-primary"></i>
            Commande #<span th:text="${commande.id}"></span>
        </h2>
        <a th:href="@{/commandes}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Retour
        </a>
    </div>

    <div class="row g-4">

        <!-- Informations -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-light fw-semibold">
                    <i class="bi bi-info-circle me-2"></i>Informations
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-5 text-muted">N° commande</dt>
                        <dd class="col-7 fw-bold">#<span th:text="${commande.id}"></span></dd>

                        <dt class="col-5 text-muted">Date</dt>
                        <dd class="col-7" th:text="${commande.dateCommande}"></dd>

                        <dt class="col-5 text-muted">Statut</dt>
                        <dd class="col-7">
                            <span th:class="${commande.statut == 'EN_COURS'} ? 'badge bg-warning text-dark' :
                                            (${commande.statut == 'VALIDEE'} ? 'badge bg-success' : 'badge bg-danger')"
                                  th:text="${commande.statut}">
                            </span>
                        </dd>

                        <dt class="col-5 text-muted">Client</dt>
                        <dd class="col-7" th:text="${commande.user.username}"></dd>

                        <dt class="col-5 text-muted">Total</dt>
                        <dd class="col-7 fw-bold text-success fs-5"
                            th:text="${#numbers.formatDecimal(commande.total,1,2)} + ' MAD'"></dd>
                    </dl>
                </div>

                <!-- Bouton Modifier → panier, seulement si EN_COURS -->
                <div class="card-footer bg-white" th:if="${commande.statut == 'EN_COURS'}">
                    <a th:href="@{/panier}" class="btn btn-warning w-100">
                        <i class="bi bi-pencil me-1"></i>Modifier dans le panier
                    </a>
                </div>
            </div>
        </div>

        <!-- Articles en lecture seule -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-light fw-semibold">
                    <i class="bi bi-box-seam me-2"></i>Articles
                    <span class="badge bg-secondary ms-2"
                          th:text="${#lists.size(commande.items)}"></span>
                </div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(commande.items)}"
                         class="text-center py-4 text-muted">
                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                        Aucun article dans cette commande.
                    </div>
                    <table th:if="${!#lists.isEmpty(commande.items)}"
                           class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Article</th>
                                <th class="text-end">Prix unit.</th>
                                <th class="text-center">Qté</th>
                                <th class="text-end">Sous-total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${commande.items}">
                                <td th:text="${item.article.description}"></td>
                                <td class="text-end text-muted"
                                    th:text="${#numbers.formatDecimal(item.article.prix,1,2)} + ' MAD'"></td>
                                <td class="text-center">
                                    <span class="badge bg-secondary"
                                          th:text="${item.quantite}"></span>
                                </td>
                                <td class="text-end fw-bold text-success"
                                    th:text="${#numbers.formatDecimal(item.sousTotal,1,2)} + ' MAD'"></td>
                            </tr>
                        </tbody>
                        <tfoot class="table-light">
                            <tr>
                                <td colspan="3" class="text-end fw-bold">Total :</td>
                                <td class="text-end fw-bold text-success fs-6"
                                    th:text="${#numbers.formatDecimal(commande.total,1,2)} + ' MAD'"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

</section>
</body>
</html>
