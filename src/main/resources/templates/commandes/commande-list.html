<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Commandes — Mini Shop</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">
            <i class="bi bi-receipt me-2 text-primary"></i>
            <!-- Titre différent selon le rôle -->
            <span th:if="${isAdmin}">Toutes les Commandes</span>
            <span th:if="${!isAdmin}">Mes Commandes</span>
        </h2>
    </div>

    <!-- Aucune commande -->
    <div th:if="${#lists.isEmpty(commandes)}" class="text-center py-5 text-muted">
        <i class="bi bi-receipt fs-1 d-block mb-3"></i>
        <p class="fs-5">Aucune commande.</p>
        <a th:if="${!isAdmin}" th:href="@{/articles}" class="btn btn-primary">
            <i class="bi bi-box-seam me-1"></i>Voir les articles
        </a>
    </div>

    <!-- Liste -->
    <div th:if="${!#lists.isEmpty(commandes)}" class="row g-3">
        <div th:each="commande : ${commandes}" class="col-12">
            <div class="card border-0 shadow-sm">

                <div class="card-header d-flex justify-content-between align-items-center bg-light">
                    <span class="fw-bold">
                        <i class="bi bi-receipt me-2"></i>
                        Commande #<span th:text="${commande.id}"></span>
                        <span class="text-muted fw-normal ms-2"
                              th:text="'— ' + ${commande.dateCommande}"></span>
                        <!-- Afficher le client si ADMIN -->
                        <span th:if="${isAdmin}"
                              class="text-muted fw-normal ms-2">
                            (<i class="bi bi-person me-1"></i><span th:text="${commande.user.username}"></span>)
                        </span>
                    </span>
                    <div class="d-flex align-items-center gap-2">
                        <span th:class="${commande.statut == 'EN_COURS'} ? 'badge bg-warning text-dark' :
                                        (${commande.statut == 'VALIDEE'} ? 'badge bg-success' : 'badge bg-danger')"
                              th:text="${commande.statut}">
                        </span>
                        <span class="badge bg-primary"
                              th:text="${#numbers.formatDecimal(commande.total,1,2)} + ' MAD'"></span>
                    </div>
                </div>

                <div class="card-body">
                    <p th:if="${#lists.isEmpty(commande.items)}" class="text-muted small mb-0">
                        Aucun article dans cette commande.
                    </p>
                    <ul th:if="${!#lists.isEmpty(commande.items)}" class="list-unstyled mb-0">
                        <li th:each="item, stat : ${commande.items}"
                            th:class="${stat.last} ? 'd-flex justify-content-between py-1' :
                                                     'd-flex justify-content-between py-1 border-bottom'">
                            <span>
                                <i class="bi bi-box me-2 text-muted"></i>
                                <span th:text="${item.article.description}" class="fw-semibold"></span>
                                <span class="text-muted ms-2">
                                    × <span th:text="${item.quantite}"></span>
                                </span>
                            </span>
                            <span class="fw-bold text-success"
                                  th:text="${#numbers.formatDecimal(item.sousTotal,1,2)} + ' MAD'"></span>
                        </li>
                    </ul>
                </div>

				<div class="card-footer bg-white d-flex gap-2">
				    <!-- Détails : toujours visible -->
				    <a th:href="@{/commandes/{id}(id=${commande.id})}"
				       class="btn btn-sm btn-outline-primary">
				        <i class="bi bi-eye me-1"></i>Détails
				    </a>
				
				    <!-- Modifier → panier : USER seulement, commande EN_COURS -->
				    <a th:if="${!isAdmin and commande.statut == 'EN_COURS'}"
				       th:href="@{/panier}"
				       class="btn btn-sm btn-warning">
				        <i class="bi bi-pencil me-1"></i>Modifier
				    </a>
				
				    <!-- Supprimer : ADMIN seulement -->
				    <a th:if="${isAdmin}"
				       th:href="@{/commandes/{id}/supprimer(id=${commande.id})}"
				       class="btn btn-sm btn-danger"
				       onclick="return confirm('Supprimer définitivement cette commande ?')">
				        <i class="bi bi-trash me-1"></i>Supprimer
				    </a>
				</div>
            </div>
        </div>
    </div>

</section>
</body>
</html>
