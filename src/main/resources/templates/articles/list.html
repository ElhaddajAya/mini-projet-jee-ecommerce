<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Articles — Mini JEE Shop</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">
            <i class="bi bi-box-seam me-2 text-primary"></i>Liste des Articles
        </h2>
        <!-- Bouton Nouvel Article : visible seulement pour ADMIN -->
        <a th:href="@{/articles/new}"
           sec:authorize="hasRole('ADMIN')"
           class="btn btn-success">
            <i class="bi bi-plus-lg me-1"></i>Nouvel Article
        </a>
    </div>

    <!-- Recherche multicritère -->
    <form th:action="@{/articles/search}" method="get" class="row g-2 mb-4">
        <div class="col-md-4">
            <input type="text" name="description" class="form-control"
                   placeholder="Description...">
        </div>
        <div class="col-md-3">
            <input type="number" name="prixMax" class="form-control"
                   placeholder="Prix max..." step="0.01">
        </div>
        <div class="col-md-3">
            <input type="number" name="stockMin" class="form-control"
                   placeholder="Stock min...">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-secondary w-100">
                <i class="bi bi-search me-1"></i>Rechercher
            </button>
        </div>
    </form>

    <!-- Tableau -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Description</th>
                        <th>Prix</th>
                        <th>Date Expiration</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="article : ${articles}">
                        <td th:text="${article.id}"></td>
                        <td th:text="${article.description}"></td>
                        <td th:text="${article.prix} + ' DH'"></td>
                        <td th:text="${article.dateExpiration}"></td>
                        <td>
                            <span th:class="${article.quantiteStock < 10} ? 'badge bg-danger' : 'badge bg-success'"
                                  th:text="${article.quantiteStock}">
                            </span>
                        </td>
                        <td>

							<!-- Bouton Panier : visible seulement pour ROLE_USER -->
							<form th:action="@{/panier/ajouter}" method="post" class="d-inline"
							      sec:authorize="hasRole('USER')">
							    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
							    <input type="hidden" name="articleId" th:value="${article.id}"/>
							    <input type="hidden" name="quantite" value="1"/>
							    <button type="submit" class="btn btn-primary btn-sm">
							        <i class="bi bi-cart-plus"></i> Panier
							    </button>
							</form>

                            <!-- Boutons Modifier/Supprimer : ADMIN seulement -->
                            <a th:href="@{/articles/edit/{id}(id=${article.id})}"
                               sec:authorize="hasRole('ADMIN')"
                               class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/articles/delete/{id}(id=${article.id})}"
                               sec:authorize="hasRole('ADMIN')"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Supprimer cet article ?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(articles)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Aucun article trouvé
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</section>
</body>
</html>
