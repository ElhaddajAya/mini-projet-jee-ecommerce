<!DOCTYPE html>
<!-- Balise html avec le namespace security -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Articles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
          rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand">Mini Projet JEE</span>

    <div class="d-flex align-items-center gap-3">

        <!-- sec:authorize vérifie le rôle de l'utilisateur connecté -->
		<span class="text-white fw-bold" sec:authorize="hasRole('ADMIN')">Administrateur</span>

        <!-- Nom de l'utilisateur connecté -->
        <span class="text-white">
            <sec:authentication property="name"/>
        </span>

        <!-- Bouton déconnexion via POST -->
        <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline-light btn-sm">Déconnexion</button>
        </form>

    </div>
</nav>

<div class="container mt-4">

    <h2>Liste des Articles</h2>

    <!-- Formulaire de recherche multicritère -->
    <form th:action="@{/articles/search}" method="get" class="row g-2 mb-3">
        <div class="col-md-4">
            <input type="text" name="description" class="form-control" 
                   placeholder="Description...">
        </div>
        <div class="col-md-3">
            <input type="number" name="prixMax" class="form-control" 
                   placeholder="Prix max..." step="0.01">
        </div>
        <div class="col-md-3">
            <input type="number" name="stockMin" class="form-control" 
                   placeholder="Stock min...">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-secondary w-100">Rechercher</button>
        </div>
    </form>

	<!-- Bouton Nouvel Article : visible seulement pour ADMIN -->
	<a th:href="@{/articles/new}" 
	   sec:authorize="hasRole('ADMIN')"
	   class="btn btn-success mb-3">+ Nouvel Article</a>
   
    <!-- Tableau des articles -->
    <table class="table table-bordered table-hover">
        <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Description</th>
                <th>Prix</th>
                <th>Date Expiration</th>
                <th>Stock</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- th:each = boucle sur la liste d'articles -->
            <tr th:each="article : ${articles}">
                <td th:text="${article.id}"></td>
                <td th:text="${article.description}"></td>
                <td th:text="${article.prix} + ' DH'"></td>
                <td th:text="${article.dateExpiration}"></td>
                <td th:text="${article.quantiteStock}"></td>
                <!-- Boutons Modifier et Supprimer : visibles seulement pour ADMIN -->
				<td>
				    <a th:href="@{/articles/edit/{id}(id=${article.id})}"
				       sec:authorize="hasRole('ADMIN')"
				       class="btn btn-warning btn-sm">Modifier</a>
				
				    <a th:href="@{/articles/delete/{id}(id=${article.id})}"
				       sec:authorize="hasRole('ADMIN')"
				       class="btn btn-danger btn-sm"
				       onclick="return confirm('Supprimer cet article ?')">Supprimer</a>
				</td>
            </tr>
            <!-- Message si aucun article -->
            <tr th:if="${#lists.isEmpty(articles)}">
                <td colspan="6" class="text-center text-muted">Aucun article trouvé</td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
