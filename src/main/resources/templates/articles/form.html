<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Article — Mini JEE Shop</title>
</head>
<body>
<section>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"
                        th:text="${article.id != null} ? 'Modifier Article' : 'Nouvel Article'">
                    </h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/articles/save}" th:object="${article}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <input type="text" th:field="*{description}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Prix (DH)</label>
                            <input type="number" th:field="*{prix}" class="form-control" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Date d'expiration</label>
                            <input type="date"
                                   id="dateExpiration" name="dateExpiration"
                                   th:value="${article.dateExpiration != null ?
                                             #temporals.format(article.dateExpiration, 'yyyy-MM-dd') : ''}"
                                   class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Quantité en stock</label>
                            <input type="number" th:field="*{quantiteStock}" class="form-control" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-lg me-1"></i>Enregistrer
                            </button>
                            <a th:href="@{/articles}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</section>
</body>
</html>
