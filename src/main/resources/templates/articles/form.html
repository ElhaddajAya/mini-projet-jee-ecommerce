<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Article</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
          rel="stylesheet">
</head>
<body>


<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand">Mini Projet JEE</span>

    <div class="d-flex align-items-center gap-3">

        <!-- sec:authorize vérifie le rôle de l'utilisateur connecté -->
		<span class="text-white fw-bold" sec:authorize="hasRole('ADMIN')">Administrateur</span>

        <!-- Nom de l'utilisateur connecté -->
        <span class="text-white">
            <sec:authentication property="name"/>
        </span>

        <!-- Bouton déconnexion via POST -->
        <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline-light btn-sm">Déconnexion</button>
        </form>

    </div>
</nav>


<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <!-- th:object = lie le formulaire à l'objet Article -->
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <!-- Si id existe → modification, sinon → création -->
                    <h5 th:text="${article.id != null} ? 'Modifier Article' : 'Nouvel Article'"></h5>
                </div>
                <div class="card-body">

                    <form th:action="@{/articles/save}" th:object="${article}" method="post">

                        <!-- Champ caché pour l'id (nécessaire pour la modification) -->
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <!-- th:field lie le champ au champ de l'objet Article -->
                            <input type="text" th:field="*{description}" 
                                   class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Prix (DH)</label>
                            <input type="number" th:field="*{prix}" 
                                   class="form-control" step="0.01" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Date d'expiration</label>
                            <!-- #temporals.format() convertit LocalDate en format attendu par HTML -->
						    <input type="date"
						           id="dateExpiration"
						           name="dateExpiration"
						           th:value="${article.dateExpiration != null ? 
						                     #temporals.format(article.dateExpiration, 'yyyy-MM-dd') : ''}"
						           class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantité en stock</label>
                            <input type="number" th:field="*{quantiteStock}" 
                                   class="form-control" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Enregistrer</button>
                            <a th:href="@{/articles}" class="btn btn-secondary">Annuler</a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
