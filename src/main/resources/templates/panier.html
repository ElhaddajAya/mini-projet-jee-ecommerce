<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Mon Panier — Mini JEE Shop</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">
            <i class="bi bi-cart me-2 text-primary"></i>Mon Panier
        </h2>
    </div>

    <!-- Panier vide -->
    <div th:if="${#lists.isEmpty(panier.commandes)}" class="text-center py-5 text-muted">
        <i class="bi bi-cart-x" style="font-size: 4rem;"></i>
        <p class="fs-5 mt-3">Votre panier est vide.</p>
        <a th:href="@{/articles}" class="btn btn-primary">
            <i class="bi bi-box-seam me-1"></i>Voir les articles
        </a>
    </div>

    <!-- Commandes EN_COURS -->
    <div th:if="${!#lists.isEmpty(panier.commandes)}">

        <div th:each="commande : ${panier.commandes}"
             th:if="${commande.statut == 'EN_COURS'}"
             th:id="'bloc-' + ${commande.id}">

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header d-flex justify-content-between align-items-center bg-light">
                    <span class="fw-bold">
                        <i class="bi bi-receipt me-2"></i>
                        Commande #<span th:text="${commande.id}"></span>
                        <span class="text-muted fw-normal" th:text="'— ' + ${commande.dateCommande}"></span>
                    </span>
                    <span class="badge bg-warning text-dark">EN COURS</span>
                </div>

                <div class="card-body p-0">

                    <!-- Aucun article -->
                    <div th:if="${#lists.isEmpty(commande.items)}"
                         class="text-center py-3 text-muted small">
                        <i class="bi bi-info-circle me-1"></i>
                        Aucun article — ajoutez-en depuis la liste des articles.
                    </div>

                    <!-- Tableau articles avec +/- -->
                    <table th:if="${!#lists.isEmpty(commande.items)}"
                           class="table table-hover align-middle mb-0"
                           th:id="'table-' + ${commande.id}">
                        <thead class="table-light">
                            <tr>
                                <th>Article</th>
                                <th class="text-end">Prix unit.</th>
                                <th class="text-center">Quantité</th>
                                <th class="text-end">Sous-total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody th:id="'body-' + ${commande.id}">
                            <tr th:each="item : ${commande.items}"
                                th:id="'row-' + ${commande.id} + '-' + ${item.id}"
                                th:data-item-id="${item.id}"
                                th:data-commande-id="${commande.id}"
                                th:data-prix="${item.article.prix}">
                                <td th:text="${item.article.description}"></td>
                                <td class="text-end text-muted"
                                    th:text="${#numbers.formatDecimal(item.article.prix,1,2)} + ' MAD'"></td>
                                <td class="text-center">
                                    <div class="d-flex align-items-center justify-content-center gap-1">
                                        <button type="button" class="btn btn-sm btn-outline-secondary px-2"
                                                th:onclick="'diminuer(' + ${commande.id} + ',' + ${item.id} + ')'">−</button>
                                        <span class="badge bg-secondary px-3"
                                              th:id="'qty-' + ${commande.id} + '-' + ${item.id}"
                                              th:text="${item.quantite}"></span>
                                        <button type="button" class="btn btn-sm btn-outline-secondary px-2"
                                                th:onclick="'augmenter(' + ${commande.id} + ',' + ${item.id} + ')'">+</button>
                                    </div>
                                </td>
                                <td class="text-end fw-bold text-success"
                                    th:id="'st-' + ${commande.id} + '-' + ${item.id}"
                                    th:text="${#numbers.formatDecimal(item.sousTotal,1,2)} + ' MAD'"></td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-sm btn-outline-danger"
                                            th:onclick="'supprimerLigne(' + ${commande.id} + ',' + ${item.id} + ')'">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot class="table-light">
                            <tr>
                                <td colspan="3" class="text-end fw-bold">Total :</td>
                                <td class="text-end fw-bold text-success fs-6"
                                    th:id="'total-' + ${commande.id}"
                                    th:text="${#numbers.formatDecimal(commande.total,1,2)} + ' MAD'"></td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

                <div class="card-footer bg-white d-flex gap-2">
                    <button type="button" class="btn btn-success btn-sm"
                            th:onclick="'validerCommande(' + ${commande.id} + ')'">
                        <i class="bi bi-check-circle me-1"></i>Valider
                    </button>
                    <a th:href="@{/commandes/{id}/annuler(id=${commande.id})}"
                       class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-x-lg me-1"></i>Annuler
                    </a>
                </div>
            </div>

            <!-- Formulaire caché pour soumettre la validation -->
            <form th:id="'form-' + ${commande.id}"
                  th:action="@{/commandes/{id}/valider-final(id=${commande.id})}"
                  method="post" style="display:none">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            </form>

        </div>

        <!-- Total général -->
        <div class="card border-2 border-primary shadow mt-2">
            <div class="card-body d-flex justify-content-between align-items-center py-3">
                <div>
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-cash-coin me-2 text-primary"></i>Total général
                    </h5>
                    <small class="text-muted">Commandes EN COURS uniquement</small>
                </div>
                <h3 class="mb-0 text-primary fw-bold" id="totalGeneral"
                    th:text="${#numbers.formatDecimal(panier.totalGeneral,1,2)} + ' MAD'"></h3>
            </div>
        </div>

        <div class="text-center mt-3">
            <a th:href="@{/commandes}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-clock-history me-1"></i>Historique des commandes
            </a>
        </div>
    </div>

    <script>
        // État local : prix[commandeId][itemId] et quantites[commandeId][itemId]
        const prix = {};
        const quantites = {};

        // Initialise depuis le DOM
        document.querySelectorAll('[data-item-id]').forEach(row => {
            const cid = row.dataset.commandeId;
            const iid = row.dataset.itemId;
            if (!prix[cid]) prix[cid] = {};
            if (!quantites[cid]) quantites[cid] = {};
            prix[cid][iid] = parseFloat(row.dataset.prix);
            const qtyEl = document.getElementById('qty-' + cid + '-' + iid);
            quantites[cid][iid] = qtyEl ? parseInt(qtyEl.textContent) : 0;
        });

        function augmenter(cid, iid) {
            quantites[cid][iid]++;
            rafraichir(cid, iid);
        }

        function diminuer(cid, iid) {
            quantites[cid][iid]--;
            if (quantites[cid][iid] <= 0) {
                supprimerLigne(cid, iid);
            } else {
                rafraichir(cid, iid);
            }
        }

        function supprimerLigne(cid, iid) {
            delete quantites[cid][iid];
            delete prix[cid][iid];
            const row = document.getElementById('row-' + cid + '-' + iid);
            if (row) row.remove();
            recalculerTotal(cid);
        }

        function rafraichir(cid, iid) {
            document.getElementById('qty-' + cid + '-' + iid).textContent = quantites[cid][iid];
            const st = (prix[cid][iid] * quantites[cid][iid]).toFixed(2);
            document.getElementById('st-' + cid + '-' + iid).textContent = st + ' MAD';
            recalculerTotal(cid);
        }

        function recalculerTotal(cid) {
            let total = 0;
            Object.keys(quantites[cid]).forEach(iid => {
                total += prix[cid][iid] * quantites[cid][iid];
            });
            const el = document.getElementById('total-' + cid);
            if (el) el.textContent = total.toFixed(2) + ' MAD';
            recalculerTotalGeneral();
        }

        function recalculerTotalGeneral() {
            let total = 0;
            Object.keys(quantites).forEach(cid => {
                Object.keys(quantites[cid]).forEach(iid => {
                    total += prix[cid][iid] * quantites[cid][iid];
                });
            });
            const el = document.getElementById('totalGeneral');
            if (el) el.textContent = total.toFixed(2) + ' MAD';
        }

        function validerCommande(cid) {
            if (!confirm('Valider cette commande ? Les stocks seront mis à jour.')) return;

            const form = document.getElementById('form-' + cid);
            form.querySelectorAll('input[name^="quantite_"]').forEach(i => i.remove());

            let nbItems = 0;
            Object.keys(quantites[cid]).forEach(iid => {
                if (quantites[cid][iid] > 0) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'quantite_' + iid;
                    input.value = quantites[cid][iid];
                    form.appendChild(input);
                    nbItems++;
                }
            });

            if (nbItems === 0) {
                alert('La commande doit contenir au moins un article.');
                return;
            }
            form.submit();
        }
    </script>

</section>
</body>
</html>
