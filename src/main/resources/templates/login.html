<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- Bootstrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <!-- Carte de login -->
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Connexion</h4>
                </div>
                <div class="card-body">

                    <!-- Message d'erreur (mauvais login) -->
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <!-- Message de déconnexion réussie -->
                    <div th:if="${logoutMessage}" class="alert alert-success" th:text="${logoutMessage}"></div>

                    <!-- 
                        th:action = l'URL où envoyer le formulaire (POST /login)
                        Spring Security intercepte ce POST automatiquement
                    -->
                    <form th:action="@{/login}" method="post">

                        <!-- Champ username -->
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" 
                                   id="username" 
                                   name="username" 
                                   class="form-control" 
                                   placeholder="Entrez votre username"
                                   required>
                        </div>

                        <!-- Champ password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Mot de passe</label>
                            <input type="password" 
                                   id="password" 
                                   name="password" 
                                   class="form-control" 
                                   placeholder="Entrez votre mot de passe"
                                   required>
                        </div>

                        <!-- Bouton de connexion -->
                        <button type="submit" class="btn btn-primary w-100">
                            Se connecter
                        </button>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
